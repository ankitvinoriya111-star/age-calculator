<body>

<main class="age-card">

        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    </div>
    <h1>Age Calculator</h1>
    <p>Find your exact age in years, months and days</p>
  </header>

  <div class="form-group">
    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" required>
  </div>

  <div class="form-group">
    <label for="toDate">Calculate Age As Of</label>
    <input type="date" id="toDate">
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="calcBtn" type="button">Calculate Age</button>
    <button class="btn btn-secondary" id="resetBtn" type="button">Reset</button>

  <div class="error-msg" id="errorMsg" role="alert"></div>

  <section class="result" id="result" aria-live="polite" aria-labelledby="resultTitle">

      <div class="label" id="yearsLabel">years old</div>

    <div class="breakdown">
      <div class="breakdown-item">
        <div class="n" id="monthsNum">0</div>

      </div>

        <div class="n" id="daysNum">0</div>
        <div class="l">Days</div>

      <div class="breakdown-item">
        <div class="n" id="totalDaysNum">0</div>
        <div class="l">Total Days</div>
      </div>
    </div>

    <div class="info-row">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">

    <div class="info-row">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
      </span>
      <span><span class="lbl">Total minutes:</span><span class="val" id="minutesVal">0</span></span>

      <span class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>

    </div>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>

          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>

<script>
(function () {
  "use strict";

  function boot() {
    var dobInput = document.getElementById("dob");
    var toDateInput = document.getElementById("toDate");
    var calcBtn = document.getElementById("calcBtn");
    var resetBtn = document.getElementById("resetBtn");
    var errorMsg = document.getElementById("errorMsg");
    var resultBox = document.getElementById("result");

    var yearsNum = document.getElementById("yearsNum");
    var yearsLabel = document.getElementById("yearsLabel");
    var monthsNum = document.getElementById("monthsNum");
    var daysNum = document.getElementById("daysNum");
    var totalDaysNum = document.getElementById("totalDaysNum");
    var hoursVal = document.getElementById("hoursVal");
    var minutesVal = document.getElementById("minutesVal");
    var secondsVal = document.getElementById("secondsVal");
    var dayOfWeekVal = document.getElementById("dayOfWeekVal");
    var nextBirthdayVal = document.getElementById("nextBirthdayVal");

    // Default the "as of" date to today
    var today = new Date();
    var yyyy = today.getFullYear();
    var mm = String(today.getMonth() + 1).padStart(2, "0");
    var dd = String(today.getDate()).padStart(2, "0");
    toDateInput.value = yyyy + "-" + mm + "-" + dd;

    // Max selectable date = today for both inputs
    dobInput.max = toDateInput.value;
    toDateInput.max = toDateInput.value;

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add("show");
      resultBox.classList.remove("show");
    }

    function hideError() {
      errorMsg.classList.remove("show");
    }

    function parseDateInput(value) {
      // value is "YYYY-MM-DD"
      var parts = value.split("-");
      if (parts.length !== 3) return null;
      var y = parseInt(parts[0], 10);
      var m = parseInt(parts[1], 10);
      var d = parseInt(parts[2], 10);
      if (isNaN(y) || isNaN(m) || isNaN(d)) return null;
      return new Date(y, m - 1, d);
    }

    function formatNumber(n) {
      return n.toLocaleString("en-US");
    }

    function calculateAge() {
      hideError();

      var dobStr = dobInput.value;
      var toStr = toDateInput.value;

      if (!dobStr) {
        showError("Please select your date of birth.");
        return;
      }
      if (!toStr) {
        showError("Please select the 'as of' date.");
        return;
      }

      var dob = parseDateInput(dobStr);
      var to = parseDateInput(toStr);

      if (!dob || !to) {
        showError("Please enter valid dates.");
        return;
      }

      if (dob > to) {
        showError("Date of birth cannot be after the 'as of' date.");
        return;
      }

      // ---------- Years, months, days ----------
      var years = to.getFullYear() - dob.getFullYear();
      var months = to.getMonth() - dob.getMonth();
      var days = to.getDate() - dob.getDate();

      if (days < 0) {
        months--;
        // days in the previous month of the "to" date
        var prevMonth = new Date(to.getFullYear(), to.getMonth(), 0);
        days += prevMonth.getDate();
      }
      if (months < 0) {
        years--;
        months += 12;
      }

      // ---------- Totals ----------
      var msPerDay = 24 * 60 * 60 * 1000;
      var diffMs = to.getTime() - dob.getTime();
      var totalDays = Math.floor(diffMs / msPerDay);
      var totalHours = Math.floor(diffMs / (60 * 60 * 1000));
      var totalMinutes = Math.floor(diffMs / (60 * 1000));
      var totalSeconds = Math.floor(diffMs / 1000);

      // ---------- Day of week born ----------
      var dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      var bornOn = dayNames[dob.getDay()];

      // ---------- Next birthday ----------
      var nextBd = new Date(to.getFullYear(), dob.getMonth(), dob.getDate());
      if (nextBd < to) {
        nextBd = new Date(to.getFullYear() + 1, dob.getMonth(), dob.getDate());
      }
      var bdDiffDays = Math.floor((nextBd.getTime() - to.getTime()) / msPerDay);
      var nextBdText;
      if (bdDiffDays === 0) {
        nextBdText = "🎉 Today! Happy Birthday!";
      } else if (bdDiffDays === 1) {
        nextBdText = "Tomorrow";
      } else {
        nextBdText = bdDiffDays + " days";
      }

      // ---------- Update UI ----------
      yearsNum.textContent = years;
      yearsLabel.textContent = years === 1 ? "year old" : "years old";
      monthsNum.textContent = months;
      daysNum.textContent = days;
      totalDaysNum.textContent = formatNumber(totalDays);
      hoursVal.textContent = formatNumber(totalHours);
      minutesVal.textContent = formatNumber(totalMinutes);
      secondsVal.textContent = formatNumber(totalSeconds);
      dayOfWeekVal.textContent = bornOn;
      nextBirthdayVal.textContent = nextBdText;

      resultBox.classList.add("show");
    }

    function resetAll() {
      dobInput.value = "";
      var now = new Date();
      var y = now.getFullYear();
      var m = String(now.getMonth() + 1).padStart(2, "0");
      var d = String(now.getDate()).padStart(2, "0");
      toDateInput.value = y + "-" + m + "-" + d;
      dobInput.max = toDateInput.value;
      toDateInput.max = toDateInput.value;
      hideError();
      resultBox.classList.remove("show");
    }

    calcBtn.addEventListener("click", calculateAge);
    resetBtn.addEventListener("click", resetAll);

    // Allow pressing Enter in either input
    dobInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") calculateAge();
    });
    toDateInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") calculateAge();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
